apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
labels:
  - pairs:
      s1/env: stage
    includeTemplates: true
patches:
  - target:
      kind: Deployment
    path: patches/deployment.yaml
  - target:
      kind: HTTPRoute
    path: patches/httproute.yaml
  - target:
      kind: ConfigMap
      name: s1-env
    path: patches/config.yaml
  - target:
      kind: Gateway
      name: system1-gateway
    path: patches/gateway.yaml
