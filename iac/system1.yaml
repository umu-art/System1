apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: system1
  namespace: argocd
spec:
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          - matrix:
              generators:
                - git:
                    repoURL: https://github.com/umu-art/system1.git
                    revision: HEAD
                    pathParamPrefix: env
                    files:
                      - path: iac/envs/*/env.yaml
                - git:
                    repoURL: https://github.com/umu-art/system1.git
                    revision: HEAD
                    pathParamPrefix: app
                    directories:
                      - path: iac/kubernetes/*
          - list:
              elementsYaml: |
                {{- if has .app.path.basename (get . "excludedApplications" | default (list)) -}}
                {{ list | toJson }}
                {{- else -}}
                {{ list (dict) | toJson }}
                {{- end -}}
  template:
    metadata:
      name: '{{ .app.path.basename }}-{{ .env.path.basename }}'
      namespace: argocd
      labels:
        app.kubernetes.io/instance: 'system1-{{ .env.path.basename }}'
    spec:
      destination:
        namespace: '{{ .namespace }}'
        server: https://kubernetes.default.svc
      source:
        path: '{{ .app.path.path }}'
        repoURL: https://github.com/umu-art/system1.git
        targetRevision: '{{ .revision }}'
        kustomize:
          components:
            - '../../envs/{{ .env.path.basename }}'
          images:
            - 'ghcr.io/umu-art/{{ .app.path.basename }}:{{ .tag }}'
          patches:
            - target:
                kind: ExternalSecret
                name: '{{ .app.path.basename }}'
              patch: |-
                - op: replace
                  path: /spec/dataFrom/0/extract/key
                  value: '{{ .namespace }}/{{ .app.path.basename }}'
      project: system1
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
