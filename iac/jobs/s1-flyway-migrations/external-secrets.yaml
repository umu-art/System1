apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s1-flyway-migrations
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: s1-flyway-migrations
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: __NAMESPACE__/s1-flyway-migrations
