apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: s1-metrics-route
spec:
  parentRefs:
    - name: system1-gateway
      namespace: istio-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/metrics
      backendRefs:
        - name: s1-metrics
          port: 80
