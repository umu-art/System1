apiVersion: apps/v1
kind: Deployment
metadata:
  name: s1-ui
  labels:
    app: s1-ui
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: s1-ui
  template:
    metadata:
      labels:
        app: s1-ui
    spec:
      containers:
        - name: s1-ui
          image: ghcr.io/umu-art/s1-ui
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              cpu: "10m"
              memory: "16M"
            limits:
              memory: "64M"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      imagePullSecrets:
        - name: github-container-registry

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

      restartPolicy: Always
