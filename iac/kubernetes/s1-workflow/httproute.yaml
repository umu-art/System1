apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: s1-workflow-route
spec:
  parentRefs:
    - name: system1-gateway
      namespace: istio-system
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/workflow/info
        - path:
            type: Exact
            value: /api/workflow/validate
      backendRefs:
        - name: s1-workflow
          port: 80
