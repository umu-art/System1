apiVersion: batch/v1
kind: CronJob
metadata:
  name: s1-material-collector
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      podFailurePolicy:
        rules:
          - action: FailJob
            onExitCodes:
              containerName: s1-material-collector
              operator: In
              values:
                - 78
      template:
        metadata:
          labels:
            app: s1-material-collector
        spec:
          serviceAccountName: s1-material-collector
          restartPolicy: Never
          imagePullSecrets:
            - name: github-container-registry
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: s1-material-collector
              image: ghcr.io/umu-art/s1-material-collector
              imagePullPolicy: Always
              env:
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
