apiVersion: v1
kind: ServiceAccount
metadata:
  name: s1-material-collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: s1-material-collector
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - s1-material-collector-mts-link
    verbs:
      - get
      - patch
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - s1-material-collector-google-drive
    verbs:
      - get
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    resourceNames:
      - s1-material-collector
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: s1-material-collector
subjects:
  - kind: ServiceAccount
    name: s1-material-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: s1-material-collector
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: s1-material-collector
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
