apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s1-workflow-validator
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: s1-workflow-validator
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: system1/s1-workflow-validator
