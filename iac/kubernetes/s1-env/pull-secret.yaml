apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-container-registry
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: github-container-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  dataFrom:
    - extract:
        key: github-container-registry
