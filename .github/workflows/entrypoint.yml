name: Assembling this whole mess

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: modules/platform
            name: s1-dialogs
            script: go

          - module: modules/scenario
            name: s1-workflow
            script: go

          - module: modules/scenario
            name: s1-workflow-validator
            script: go

          - module: modules/tools
            name: s1-material-collector
            script: go
            cronjob: true
            prod-only: true

          - module: modules/copilot
            name: s1-scenario-builder
            script: python

          - module: modules/analytics
            name: s1-metrics
            script: python

          - module: modules/ui
            name: s1-ui
            script: node

    uses: ./.github/workflows/_build-module.yml
    with:
      module: ${{ matrix.module }}
      name: ${{ matrix.name }}
      script: ${{ matrix.script }}
      env: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'stage' }}
      test-only: ${{ (github.event_name != 'push' || (matrix.prod-only && !startsWith(github.ref, 'refs/tags/v'))) && 'true' || 'false' }}
      skip-rollout: ${{ matrix.cronjob == true }}
    secrets: inherit

  flyway-migrations:
    name: Flyway migrations
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/umu-art/s1-flyway-migrations:${{ github.sha }}
      STAND: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'stage' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: umu-art
          password: ${{ secrets.PACKAGES_TOKEN }}

      - name: Build and push Flyway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: iac/images/s1-flyway-migrations/Dockerfile
          tags: ${{ env.IMAGE }}
          pull: true
          push: true

      - uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBESECRET }}

      - name: Create migration Job
        shell: bash
        run: |
          namespace=$(yq -r '.namespace' "iac/envs/$STAND/env.yaml")
          kubectl set image --local -f iac/jobs/s1-flyway-migrations/job.yaml "flyway=$IMAGE" -o yaml |
            kubectl create -n "$namespace" -f -

  sync-iac:
    name: Sync IaC (ArgoCD)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync
        uses: ./.github/workflows/actions/argo_sync
        with:
          argocd-server: ${{ secrets.ARGOCD_SERVER }}
          argocd-token: ${{ secrets.ARGOCD_TOKEN }}
          instance: system1-${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'stage' }}
