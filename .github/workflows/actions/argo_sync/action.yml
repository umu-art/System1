name: "ArgoCD Sync"
description: "Sync ArgoCD applications to the release revision"

inputs:
  argocd-server:
    description: "ArgoCD url"
    required: true
  argocd-token:
    description: "Токен ArgoCD"
    required: true
  instance:
    description: "Метка app.kubernetes.io/instance (system1-stage, system1-prod)"
    required: true

  revision:
    description: "SHA релиза, для которого завершились миграции"
    required: true

runs:
  using: "composite"
  steps:
    - name: Sync ArgoCD applications
      uses: clowdhaus/argo-cd-action/@main
      with:
        version: 3.1.5
        options: --server ${{ inputs.argocd-server }} --grpc-web --auth-token ${{ inputs.argocd-token }}
        command: app sync -l app.kubernetes.io/instance=${{ inputs.instance }} --revision ${{ inputs.revision }} --prune --timeout 600
