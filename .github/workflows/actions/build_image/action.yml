name: "Build and push image"
description: "Build and push Docker image to GHCR"

inputs:
  image:
    description: 'Image name'
    required: true
  actor:
    description: 'github.actor'
    required: true
  token:
    description: 'token'
    required: true

outputs:
  digest:
    description: Published image digest
    value: ${{ steps.build.outputs.digest }}

runs:
  using: "composite"
  steps:
    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ inputs.actor }}
        password: ${{ inputs.token }}

    - name: Build and push Docker image for ${{ inputs.image }}
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./iac/images/${{ inputs.image }}/Dockerfile
        push: true
        tags: ghcr.io/${{ inputs.actor }}/${{ inputs.image }}:sha-${{ github.sha }}
