name: Build module

on:
  workflow_call:
    inputs:
      module:
        description: "Каталог раздела в репозитории (modules/platform)"
        type: string
        required: true
      name:
        description: "Имя сервиса, образа, деплоймента и каталога в iac/kubernetes (s1-dialogs)"
        type: string
        required: true
      script:
        description: "Среда (python, go, node)"
        type: string
        required: true
      test-only:
        description: "Только тесты, без сборки образа и деплоя (true на PR)"
        type: string
        required: true
      skip-rollout:
        description: "Не передавать CronJob на шаг перезапуска Deployment"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changes
        id: filter
        if: inputs.test-only == 'true'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            changed:
              - '${{ inputs.module }}/**'
              - 'api/**'
              - 'iac/images/${{ inputs.name }}/**'

      - name: Prepare environment
        if: inputs.test-only != 'true' || steps.filter.outputs.changed == 'true'
        uses: ./.github/workflows/actions/prepare_env

      - name: Run tests and build
        if: inputs.test-only != 'true' || steps.filter.outputs.changed == 'true'
        uses: ./.github/workflows/actions/scripts
        with:
          script: ${{ inputs.script }}
          module: ${{ inputs.module }}
          name: ${{ inputs.name }}
          test-only: ${{ inputs.test-only }}

      - name: Build Docker image
        id: image
        if: inputs.test-only != 'true'
        uses: ./.github/workflows/actions/build_image
        with:
          image: ${{ inputs.name }}
          actor: umu-art
          token: ${{ secrets.PACKAGES_TOKEN }}

      - name: Record service image for release
        if: inputs.test-only != 'true'
        env:
          SERVICE: ${{ inputs.name }}
          DIGEST: ${{ steps.image.outputs.digest }}
          SKIP_ROLLOUT: ${{ inputs.skip-rollout }}
        run: printf '%s\n%s\n' "$DIGEST" "$SKIP_ROLLOUT" > "$RUNNER_TEMP/$SERVICE"

      - name: Upload service image metadata
        if: inputs.test-only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: service-image-${{ inputs.name }}
          path: ${{ runner.temp }}/${{ inputs.name }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7
