openapi: 3.1.0

info:
  title: Dialogs Api
  description: Контракт сервиса s1-dialogs. Сервис хранит клиентов и их диалоги с сервисами авторов, а шлюз каналов и автор работают с ними через этот API.
  version: 1.0.0

paths:
  /api/dialogs/info:
    get:
      tags:
        - dialogs
      operationId: getDialogsInfo
      summary: Получить имя сервиса и окружение, в котором он запущен
      description: Служебный метод, чтобы проверить, что запрос дошёл до нужного сервиса в нужном окружении.
      responses:
        '200':
          description: Сведения о сервисе
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ServiceInfoDto'

  /api/dialogs/client:
    post:
      tags:
        - client
      operationId: createClient
      summary: Создать клиента
      description: Заводит в системе нового клиента — человека, который написал боту сервиса.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
      responses:
        '201':
          description: Клиент создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDto'
    put:
      tags:
        - client
      operationId: updateClient
      summary: Синхронизировать данные клиента с платформой
      description: Обновляет данные клиента.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClientRequest'
      responses:
        '200':
          description: Данные клиента обновлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDto'
    get:
      tags:
        - client
      operationId: getClient
      summary: Получить клиента сервиса
      description: Возвращает клиента сервиса автора вместе с его статусом в этом сервисе.
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            format: uuid
            description: Идентификатор клиента.
        - name: serviceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
            description: Сервис автора.
      responses:
        '200':
          description: Клиент сервиса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceClientDto'

  /api/dialogs/client/list:
    get:
      tags:
        - client
      operationId: listClients
      summary: Получить клиентов сервиса
      description: Возвращает клиентов сервиса автора постранично, новые первыми.
      parameters:
        - name: serviceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
            description: Сервис автора.
        - name: status
          in: query
          required: false
          schema:
            type: string
            description: Показать только клиентов с этим статусом.
            enum:
              - active
              - restricted
              - blocked
        - name: page
          in: query
          required: false
          schema:
            type: integer
            description: Номер страницы, начиная с 0.
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            description: Количество записей на странице.
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Страница клиентов сервиса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceClientPageDto'

  /api/dialogs/client/block:
    post:
      tags:
        - client
      operationId: blockClient
      summary: Заблокировать клиента в сервисе
      description: Блокирует клиента в сервисе автора, сервис перестаёт ему отвечать.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceClientRequest'
      responses:
        '200':
          description: Клиент заблокирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceClientDto'

  /api/dialogs/client/unblock:
    post:
      tags:
        - client
      operationId: unblockClient
      summary: Разблокировать клиента в сервисе
      description: Снимает блокировку клиента в сервисе автора.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceClientRequest'
      responses:
        '200':
          description: Клиент разблокирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceClientDto'

  /api/dialogs/dialog:
    post:
      tags:
        - dialog
      operationId: createDialog
      summary: Создать диалог с клиентом
      description: Создаёт диалог клиента с сервисом в одном канале. В этом диалоге хранятся сообщения клиента и ответы сервиса.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDialogRequest'
      responses:
        '201':
          description: Диалог создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialogDto'
    get:
      tags:
        - dialog
      operationId: getDialog
      summary: Получить диалог сервиса
      description: Возвращает диалог сервиса автора.
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            format: uuid
            description: Идентификатор диалога.
        - name: serviceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
            description: Сервис автора.
      responses:
        '200':
          description: Диалог
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialogDto'

  /api/dialogs/dialog/list:
    get:
      tags:
        - dialog
      operationId: listDialogs
      summary: Получить диалоги сервиса
      description: Возвращает диалоги сервиса автора постранично, сначала диалоги с самыми свежими сообщениями.
      parameters:
        - name: serviceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
            description: Сервис автора.
        - name: clientId
          in: query
          required: false
          schema:
            type: string
            format: uuid
            description: Показать только диалоги этого клиента.
        - name: status
          in: query
          required: false
          schema:
            type: string
            description: Показать только диалоги с этим статусом.
            enum:
              - active
              - client_blocked_bot
        - name: page
          in: query
          required: false
          schema:
            type: integer
            description: Номер страницы, начиная с 0.
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            description: Количество записей на странице.
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Страница диалогов сервиса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialogPageDto'

  /api/dialogs/dialog/client-blocked:
    post:
      tags:
        - dialog
      operationId: markDialogClientBlocked
      summary: Отметить, что клиент заблокировал бота
      description: Сообщает, что клиент заблокировал бота и отправлять сообщения в этот диалог больше нельзя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DialogRequest'
      responses:
        '200':
          description: Статус диалога изменён

  /api/dialogs/dialog/client-unblocked:
    post:
      tags:
        - dialog
      operationId: markDialogClientUnblocked
      summary: Отметить, что клиент разблокировал бота
      description: Сообщает, что клиент разблокировал бота и в диалог снова можно отправлять сообщения.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DialogRequest'
      responses:
        '200':
          description: Статус диалога изменён

components:
  schemas:

    CreateClientRequest:
      type: object
      description: Данные нового клиента из профиля на платформе.
      required:
        - displayName
      properties:
        displayName:
          type: string
          description: Отображаемое имя из профиля на платформе.
          example: Маша
        language:
          type: string
          description: Язык из профиля на платформе.
          example: ru
        phone:
          type: string
          description: Телефон, если платформа его передала.
          example: '79161234567'
        email:
          type: string
          description: Email, если платформа его передала.
          example: masha@example.com

    UpdateClientRequest:
      type: object
      description: Актуальные данные клиента из профиля на платформе.
      required:
        - clientId
        - displayName
      properties:
        clientId:
          type: string
          format: uuid
          description: Идентификатор клиента.
        displayName:
          type: string
          description: Отображаемое имя из профиля на платформе.
          example: Маша
        language:
          type: string
          description: Язык из профиля на платформе.
          example: ru
        phone:
          type: string
          description: Телефон, если платформа его передала.
          example: '79161234567'
        email:
          type: string
          description: Email, если платформа его передала.
          example: masha@example.com

    ClientDto:
      type: object
      description: Клиент — человек, который пишет ботам сервисов.
      required:
        - id
        - displayName
        - created
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор клиента.
        displayName:
          type: string
          description: Отображаемое имя.
          example: Маша
        language:
          type:
            - string
            - 'null'
          description: Язык клиента.
          example: ru
        phone:
          type:
            - string
            - 'null'
          description: Телефон клиента.
          example: '79161234567'
        email:
          type:
            - string
            - 'null'
          description: Email клиента.
          example: masha@example.com
        created:
          type: string
          format: date-time
          description: Когда клиент создан.
          example: '2026-11-24T10:00:00Z'

    ServiceClientRequest:
      type: object
      description: Клиент в сервисе автора.
      required:
        - clientId
        - serviceId
      properties:
        clientId:
          type: string
          format: uuid
          description: Идентификатор клиента.
        serviceId:
          type: string
          format: uuid
          description: Сервис автора.

    ServiceClientDto:
      type: object
      description: Клиент глазами автора сервиса — данные клиента и его статус в сервисе.
      required:
        - clientId
        - serviceId
        - displayName
        - status
        - created
      properties:
        clientId:
          type: string
          format: uuid
          description: Идентификатор клиента.
        serviceId:
          type: string
          format: uuid
          description: Сервис автора.
        displayName:
          type: string
          description: Отображаемое имя.
          example: Маша
        language:
          type:
            - string
            - 'null'
          description: Язык клиента.
          example: ru
        phone:
          type:
            - string
            - 'null'
          description: Телефон клиента.
          example: '79161234567'
        email:
          type:
            - string
            - 'null'
          description: Email клиента.
          example: masha@example.com
        status:
          type: string
          description: Статус клиента в сервисе. restricted — тариф автора не позволяет обслуживать клиента, blocked — автор заблокировал клиента.
          enum:
            - active
            - restricted
            - blocked
          example: active
        created:
          type: string
          format: date-time
          description: Когда клиент появился в сервисе.
          example: '2026-11-24T10:00:00Z'

    ServiceClientPageDto:
      type: object
      description: Страница клиентов сервиса.
      required:
        - items
        - page
        - size
        - total
      properties:
        items:
          type: array
          description: Клиенты на странице.
          items:
            $ref: '#/components/schemas/ServiceClientDto'
        page:
          type: integer
          description: Номер страницы, начиная с 0.
        size:
          type: integer
          description: Размер страницы.
        total:
          type: integer
          description: Сколько всего клиентов подходит под условия.

    CreateDialogRequest:
      type: object
      description: Данные нового диалога.
      required:
        - clientId
        - serviceId
        - type
      properties:
        clientId:
          type: string
          format: uuid
          description: Клиент, с которым ведётся диалог.
        serviceId:
          type: string
          format: uuid
          description: Сервис, которому принадлежит диалог.
        type:
          type: string
          description: Тип диалога. Пока поддерживается только private.
          enum:
            - private
            - group
          example: private

    DialogRequest:
      type: object
      description: Диалог, к которому относится действие.
      required:
        - dialogId
      properties:
        dialogId:
          type: string
          format: uuid
          description: Идентификатор диалога.

    DialogDto:
      type: object
      description: Диалог клиента с сервисом в одном канале.
      required:
        - id
        - serviceId
        - clientId
        - type
        - status
        - created
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор диалога.
        serviceId:
          type: string
          format: uuid
          description: Сервис, которому принадлежит диалог.
        clientId:
          type: string
          format: uuid
          description: Клиент, с которым ведётся диалог.
        type:
          type: string
          description: Тип диалога.
          enum:
            - private
            - group
          example: private
        status:
          type: string
          description: Состояние диалога. client_blocked_bot — клиент заблокировал бота, отправить сообщение нельзя.
          enum:
            - active
            - client_blocked_bot
          example: active
        lastMessageAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Время последнего сообщения в диалоге.
          example: '2026-11-24T10:00:00Z'
        created:
          type: string
          format: date-time
          description: Когда диалог создан.
          example: '2026-11-24T10:00:00Z'

    DialogPageDto:
      type: object
      description: Страница диалогов сервиса.
      required:
        - items
        - page
        - size
        - total
      properties:
        items:
          type: array
          description: Диалоги на странице.
          items:
            $ref: '#/components/schemas/DialogDto'
        page:
          type: integer
          description: Номер страницы, начиная с 0.
        size:
          type: integer
          description: Размер страницы.
        total:
          type: integer
          description: Сколько всего диалогов подходит под условия.
