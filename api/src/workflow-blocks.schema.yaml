openapi: 3.1.0

info:
  title: Workflow Blocks Api
  description: Каталог десяти типов System1. Каждая запись содержит самостоятельную JSON Schema Draft 2020-12 для объекта, полученного из строки metadata.
  version: 1.0.0

components:
  schemas:
    WorkflowBlockDto:
      title: WorkflowBlockDto
      type: object
      description: Блок воркфлоу с параметрами из каталога типов.
      required:
        - id
        - type
        - metadata
      properties:
        id:
          type: string
          minLength: 1
          description: Строковый идентификатор, уникальный в пределах воркфлоу. Регистр имеет значение.
        type:
          type: string
          description: Тип блока из каталога.
          minLength: 1
          example: send_message
        metadata:
          type: string
          contentMediaType: application/json
          description: JSON-строка с объектом параметров и переходов блока. Формат объекта задаёт тип блока.

    WorkflowBlockTypeDto:
      title: WorkflowBlockTypeDto
      type: object
      description: Описание типа блока и схема его параметров.
      required:
        - type
        - description
        - schema
      properties:
        type:
          type: string
          description: Тип блока. Это значение указывается в WorkflowBlockDto.type.
          example: send_message
        description:
          type: string
          description: Назначение блока и его поведение при выполнении.
        schema:
          type: string
          contentMediaType: application/json
          description: JSON-строка со схемой Draft 2020-12 для объекта, полученного при разборе metadata.

    WorkflowBlockCatalogDto:
      title: WorkflowBlockCatalogDto
      type: object
      description: Каталог типов, которые принимает валидатор.
      required:
        - blockTypes
      properties:
        blockTypes:
          type: array
          description: Поддерживаемые типы блоков и их схемы.
          items:
            $ref: '#/components/schemas/WorkflowBlockTypeDto'

  examples:
    workflow-block-catalog-example:
      summary: Десять типов блоков System1
      value:
        blockTypes:
          - type: command
            description: >-
              Принимает команду. entry открывает запуск, run продолжает по кнопке тот запуск, в котором её показали.
            schema: |-
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "properties": {
                  "command": {"$ref": "#/$defs/commandName", "description": "Имя команды со слешем."},
                  "scope": {
                    "enum": ["entry", "run"],
                    "description": "entry открывает запуск, run продолжает запуск по кнопке."
                  },
                  "next": {"$ref": "#/$defs/blockId", "description": "ID следующего блока после успешного шага."}
                },
                "required": ["command", "scope", "next"],
                "additionalProperties": false,
                "$defs": {
                  "commandName": {"type": "string", "pattern": "^/[a-z0-9_]{1,32}$"},
                  "blockId": {
                    "type": "string",
                    "minLength": 1,
                    "description": "Непустой ID целевого блока в этом воркфлоу. Регистр учитывается."
                  }
                },
                "examples": [
                  {"command": "/video", "scope": "entry", "next": "VIDEO.greeting"}
                ]
              }

          - type: wait_message
            description: >-
              Принимает текст в <id>.result.text. Если блок назначен внешним входом, первая реплика открывает запуск и сразу выполняет next. Возврат в блок открывает ожидание следующей реплики.
            schema: |-
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "properties": {
                  "priority": {
                    "type": "integer",
                    "minimum": 0,
                    "default": 0,
                    "description": "При конкуренции ожиданий выбирается большее значение."
                  },
                  "resetAfterReceive": {
                    "type": "boolean",
                    "default": true,
                    "description": "Закрыть ожидание после первого принятого сообщения."
                  },
                  "saveAs": {
                    "type": "string",
                    "pattern": "^[A-Za-z][A-Za-z0-9_]{0,63}$",
                    "description": "Дополнительно сохранить текст в input.<имя>."
                  },
                  "next": {"$ref": "#/$defs/blockId", "description": "ID следующего блока после успешного шага."}
                },
                "additionalProperties": false,
                "required": ["next"],
                "$defs": {
                  "blockId": {
                    "type": "string",
                    "minLength": 1,
                    "description": "Непустой ID целевого блока в этом воркфлоу. Регистр учитывается."
                  }
                },
                "examples": [
                  {"priority": 0, "resetAfterReceive": true, "next": "VIDEO.check"}
                ]
              }

          - type: wait_payment
            description: >-
              Ожидает окончательный статус конкретного платежа. Результат содержит paymentId, status и amount. Ранее полученный статус также завершает ожидание. Повтор уведомления по одной оплате не повторяет переход.
            schema: |-
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "properties": {
                  "paymentId": {"$ref": "#/$defs/textValue", "description": "Идентификатор платежа ЮKassa или ссылка на него."},
                  "onSucceeded": {"$ref": "#/$defs/blockId", "description": "ID блока после подтверждения оплаты."},
                  "onCanceled": {"$ref": "#/$defs/blockId", "description": "ID блока после отмены платежа."}
                },
                "required": ["paymentId", "onSucceeded", "onCanceled"],
                "additionalProperties": false,
                "$defs": {
                  "textValue": {
                    "oneOf": [
                      {"type": "string", "minLength": 1},
                      {"$ref": "#/$defs/reference"}
                    ]
                  },
                  "reference": {
                    "type": "object",
                    "properties": {
                      "ref": {"$ref": "#/$defs/readPath"}
                    },
                    "required": ["ref"],
                    "additionalProperties": false,
                    "description": "Объект с единственным полем ref. После чтения пути движок проверяет тип полученного значения."
                  },
                  "readPath": {
                    "type": "string",
                    "pattern": "^(?:event\\.text|(?:input|state)\\.[A-Za-z][A-Za-z0-9_]*(?:\\.[A-Za-z][A-Za-z0-9_]*)*|.+\\.result(?:\\.[A-Za-z][A-Za-z0-9_]*)*)$",
                    "description": "Путь в input или state, event.text либо <id>.result с необязательным путём к полю результата текущего запуска."
                  },
                  "blockId": {
                    "type": "string",
                    "minLength": 1,
                    "description": "Непустой ID целевого блока в этом воркфлоу. Регистр учитывается."
                  }
                },
                "examples": [
                  {
                    "paymentId": {"ref": "VIDEO.invoice.result.paymentId"},
                    "onSucceeded": "VIDEO.credit",
                    "onCanceled": "VIDEO.payment_issue"
                  }
                ]
              }

          - type: send_message
            description: >-
              Отправляет текст или медиа с необязательными кнопками. После подтверждения доставки выполняет next, если он указан.
            schema: |-
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "properties": {
                  "text": {"type": "string", "minLength": 1, "description": "Непустой текст сообщения."},
                  "media": {
                    "$ref": "#/$defs/reference",
                    "description": "Ссылка на медиаобъект, например результат генерации."
                  },
                  "buttons": {
                    "type": "array",
                    "minItems": 1,
                    "uniqueItems": true,
                    "items": {"$ref": "#/$defs/button"},
                    "description": "Кнопки в порядке показа. У каждой есть подпись и одно действие: command или url."
                  },
                  "next": {"$ref": "#/$defs/blockId", "description": "ID следующего блока после успешного шага."}
                },
                "additionalProperties": false,
                "oneOf": [
                  {
                    "required": ["text"]
                  },
                  {
                    "required": ["media"]
                  }
                ],
                "$defs": {
                  "reference": {
                    "type": "object",
                    "properties": {
                      "ref": {"$ref": "#/$defs/readPath"}
                    },
                    "required": ["ref"],
                    "additionalProperties": false,
                    "description": "Объект с единственным полем ref. После чтения пути движок проверяет тип полученного значения."
                  },
                  "readPath": {
                    "type": "string",
                    "pattern": "^(?:event\\.text|(?:input|state)\\.[A-Za-z][A-Za-z0-9_]*(?:\\.[A-Za-z][A-Za-z0-9_]*)*|.+\\.result(?:\\.[A-Za-z][A-Za-z0-9_]*)*)$",
                    "description": "Путь в input или state, event.text либо <id>.result с необязательным путём к полю результата текущего запуска."
                  },
                  "button": {
                    "oneOf": [
                      {
                        "type": "object",
                        "properties": {
                          "text": {"type": "string", "minLength": 1},
                          "command": {"$ref": "#/$defs/commandName"}
                        },
                        "required": ["text", "command"],
                        "additionalProperties": false
                      },
                      {
                        "type": "object",
                        "properties": {
                          "text": {"type": "string", "minLength": 1},
                          "url": {
                            "oneOf": [
                              {"type": "string", "pattern": "^(?:https?|tg)://[^\\s]+$"},
                              {"$ref": "#/$defs/reference"}
                            ]
                          }
                        },
                        "required": ["text", "url"],
                        "additionalProperties": false
                      }
                    ]
                  },
                  "commandName": {"type": "string", "pattern": "^/[a-z0-9_]{1,32}$"},
                  "blockId": {
                    "type": "string",
                    "minLength": 1,
                    "description": "Непустой ID целевого блока в этом воркфлоу. Регистр учитывается."
                  }
                },
                "examples": [
                  {
                    "text": "Оплатить видеопоздравление",
                    "buttons": [
                      {
                        "text": "Оплатить",
                        "url": {"ref": "VIDEO.invoice.result.paymentUrl"}
                      }
                    ],
                    "next": "VIDEO.paid"
                  }
                ]
              }

          - type: set_value
            description: >-
              Присваивает переменной литерал или значение по ссылке. Допустимость записи в конкретное поле state проверяет движок.
            schema: |-
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "properties": {
                  "ref": {"$ref": "#/$defs/writePath", "description": "Путь переменной для записи."},
                  "value": {
                    "oneOf": [
                      {"$ref": "#/$defs/scalar"},
                      {"$ref": "#/$defs/reference"}
                    ],
                    "description": "Скалярный литерал либо объект {ref}. Ссылка может вернуть объект, например результат генерации."
                  },
                  "next": {"$ref": "#/$defs/blockId", "description": "ID следующего блока после успешного шага."}
                },
                "required": ["ref", "value"],
                "additionalProperties": false,
                "$defs": {
                  "writePath": {
                    "type": "string",
                    "pattern": "^(?:input|state)\\.[A-Za-z][A-Za-z0-9_]*(?:\\.[A-Za-z][A-Za-z0-9_]*)*$"
                  },
                  "scalar": {
                    "type": ["string", "number", "boolean", "null"]
                  },
                  "reference": {
                    "type": "object",
                    "properties": {
                      "ref": {"$ref": "#/$defs/readPath"}
                    },
                    "required": ["ref"],
                    "additionalProperties": false,
                    "description": "Объект с единственным полем ref. После чтения пути движок проверяет тип полученного значения."
                  },
                  "readPath": {
                    "type": "string",
                    "pattern": "^(?:event\\.text|(?:input|state)\\.[A-Za-z][A-Za-z0-9_]*(?:\\.[A-Za-z][A-Za-z0-9_]*)*|.+\\.result(?:\\.[A-Za-z][A-Za-z0-9_]*)*)$",
                    "description": "Путь в input или state, event.text либо <id>.result с необязательным путём к полю результата текущего запуска."
                  },
                  "blockId": {
                    "type": "string",
                    "minLength": 1,
                    "description": "Непустой ID целевого блока в этом воркфлоу. Регистр учитывается."
                  }
                },
                "examples": [
                  {
                    "ref": "input.savedAudio",
                    "value": {"ref": "VIDEO.voice.result"},
                    "next": "VIDEO.clip"
                  }
                ]
              }

          - type: add_value
            description: >-
              Атомарно прибавляет число к числовой переменной. Отрицательное значение уменьшает её. При начислении по оплате повтор обработки платежа должен дать одно зачисление.
            schema: |-
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "properties": {
                  "ref": {"$ref": "#/$defs/writePath", "description": "Путь к изменяемой числовой переменной."},
                  "value": {"$ref": "#/$defs/numberValue", "description": "Число или объект {ref}, указывающий на число."},
                  "next": {"$ref": "#/$defs/blockId", "description": "ID следующего блока после успешного шага."}
                },
                "required": ["ref", "value"],
                "additionalProperties": false,
                "$defs": {
                  "writePath": {
                    "type": "string",
                    "pattern": "^(?:input|state)\\.[A-Za-z][A-Za-z0-9_]*(?:\\.[A-Za-z][A-Za-z0-9_]*)*$"
                  },
                  "numberValue": {
                    "oneOf": [
                      {"type": "number"},
                      {"$ref": "#/$defs/reference"}
                    ]
                  },
                  "reference": {
                    "type": "object",
                    "properties": {
                      "ref": {"$ref": "#/$defs/readPath"}
                    },
                    "required": ["ref"],
                    "additionalProperties": false,
                    "description": "Объект с единственным полем ref. После чтения пути движок проверяет тип полученного значения."
                  },
                  "readPath": {
                    "type": "string",
                    "pattern": "^(?:event\\.text|(?:input|state)\\.[A-Za-z][A-Za-z0-9_]*(?:\\.[A-Za-z][A-Za-z0-9_]*)*|.+\\.result(?:\\.[A-Za-z][A-Za-z0-9_]*)*)$",
                    "description": "Путь в input или state, event.text либо <id>.result с необязательным путём к полю результата текущего запуска."
                  },
                  "blockId": {
                    "type": "string",
                    "minLength": 1,
                    "description": "Непустой ID целевого блока в этом воркфлоу. Регистр учитывается."
                  }
                },
                "examples": [
                  {"ref": "state.generations_allowed", "value": 1, "next": "VIDEO.voice"}
                ]
              }

          - type: condition
            description: >-
              Проверяет cases по порядку. Первое совпадение выбирает next соответствующей ветки. Если ни одна ветка не подошла, выполняет default.
            schema: |-
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "properties": {
                  "cases": {
                    "type": "array",
                    "minItems": 1,
                    "items": {"$ref": "#/$defs/branch"},
                    "description": "Условия по порядку проверки."
                  },
                  "default": {"$ref": "#/$defs/blockId", "description": "ID блока, если все условия дали false."}
                },
                "required": ["cases", "default"],
                "additionalProperties": false,
                "$defs": {
                  "branch": {
                    "type": "object",
                    "properties": {
                      "predicate": {
                        "enum": ["eq", "lt", "gt"]
                      },
                      "ref": {"$ref": "#/$defs/readPath"},
                      "value": {"$ref": "#/$defs/scalar"},
                      "transform": {"const": "length"},
                      "next": {"$ref": "#/$defs/blockId"}
                    },
                    "required": ["predicate", "ref", "value", "next"],
                    "additionalProperties": false,
                    "allOf": [
                      {
                        "if": {
                          "properties": {
                            "predicate": {
                              "enum": ["lt", "gt"]
                            }
                          }
                        },
                        "then": {
                          "properties": {
                            "value": {"type": "number"}
                          }
                        }
                      },
                      {
                        "if": {
                          "required": ["transform"]
                        },
                        "then": {
                          "properties": {
                            "value": {"type": "integer", "minimum": 0}
                          }
                        }
                      }
                    ]
                  },
                  "readPath": {
                    "type": "string",
                    "pattern": "^(?:event\\.text|(?:input|state)\\.[A-Za-z][A-Za-z0-9_]*(?:\\.[A-Za-z][A-Za-z0-9_]*)*|.+\\.result(?:\\.[A-Za-z][A-Za-z0-9_]*)*)$",
                    "description": "Путь в input или state, event.text либо <id>.result с необязательным путём к полю результата текущего запуска."
                  },
                  "scalar": {
                    "type": ["string", "number", "boolean", "null"]
                  },
                  "blockId": {
                    "type": "string",
                    "minLength": 1,
                    "description": "Непустой ID целевого блока в этом воркфлоу. Регистр учитывается."
                  }
                },
                "examples": [
                  {
                    "cases": [
                      {
                        "ref": "VIDEO.greeting.result.text",
                        "transform": "length",
                        "predicate": "lt",
                        "value": 30,
                        "next": "VIDEO.ask_again"
                      }
                    ],
                    "default": "VIDEO.invoice"
                  }
                ]
              }

          - type: create_invoice
            description: >-
              Создаёт в ЮKassa одностадийный платёж с перенаправлением. Результат содержит paymentId, paymentUrl и amount. Ссылка на оплату доступна в <id>.result.paymentUrl.
            schema: |-
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "properties": {
                  "shopId": {"type": "string", "minLength": 1, "description": "Идентификатор магазина ЮKassa."},
                  "secretKey": {"type": "string", "minLength": 1, "writeOnly": true, "description": "Секретный ключ магазина."},
                  "amount": {
                    "$ref": "#/$defs/amount",
                    "description": "Положительная сумма десятичной строкой с двумя знаками и трёхбуквенный код валюты."
                  },
                  "returnUrl": {
                    "type": "string",
                    "pattern": "^https?://[^\\s]+$",
                    "description": "HTTP(S) URL для возврата пользователя после оплаты."
                  },
                  "description": {
                    "type": "string",
                    "minLength": 1,
                    "description": "Описание платежа для покупателя, до 128 символов.",
                    "maxLength": 128
                  },
                  "receipt": {
                    "type": "object",
                    "minProperties": 1,
                    "description": "Данные для чека в формате ЮKassa, если магазин передаёт их при создании платежа."
                  },
                  "next": {"$ref": "#/$defs/blockId", "description": "ID следующего блока после успешного шага."},
                  "onError": {"$ref": "#/$defs/blockId", "description": "ID блока обработки ошибки шага."}
                },
                "required": ["shopId", "secretKey", "amount", "returnUrl"],
                "additionalProperties": false,
                "$defs": {
                  "amount": {
                    "type": "object",
                    "properties": {
                      "value": {
                        "type": "string",
                        "pattern": "^(?:0|[1-9][0-9]*)\\.[0-9]{2}$",
                        "not": {"const": "0.00"}
                      },
                      "currency": {"type": "string", "pattern": "^[A-Z]{3}$"}
                    },
                    "required": ["value", "currency"],
                    "additionalProperties": false
                  },
                  "blockId": {
                    "type": "string",
                    "minLength": 1,
                    "description": "Непустой ID целевого блока в этом воркфлоу. Регистр учитывается."
                  }
                },
                "examples": [
                  {
                    "shopId": "shop-example",
                    "secretKey": "<секретный ключ>",
                    "amount": {"value": "199.00", "currency": "RUB"},
                    "returnUrl": "https://example.org/return",
                    "description": "Видеопоздравление",
                    "next": "VIDEO.pay_link",
                    "onError": "VIDEO.payment_issue"
                  }
                ]
              }

          - type: generate_audio
            description: >-
              Озвучивает текстовые элементы input по порядку. После сохранения файла <id>.result содержит assetId, kind со значением audio и mimeType.
            schema: |-
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "properties": {
                  "model": {"type": "string", "minLength": 1, "description": "Идентификатор вызываемой модели."},
                  "token": {
                    "type": "string",
                    "minLength": 1,
                    "writeOnly": true,
                    "description": "Токен авторизации, если модель его требует."
                  },
                  "input": {
                    "type": "array",
                    "description": "Один или несколько текстовых фрагментов. Порядок и повторы сохраняются.",
                    "minItems": 1,
                    "items": {"$ref": "#/$defs/textInput"}
                  },
                  "next": {"$ref": "#/$defs/blockId", "description": "ID следующего блока после успешного шага."},
                  "onError": {"$ref": "#/$defs/blockId", "description": "ID блока обработки ошибки шага."}
                },
                "required": ["model", "input"],
                "additionalProperties": false,
                "$defs": {
                  "textInput": {
                    "type": "object",
                    "required": ["type", "value"],
                    "properties": {
                      "type": {"const": "text"},
                      "value": {
                        "$ref": "#/$defs/textValue",
                        "description": "Непустая строка или объект {ref}, указывающий на строку."
                      }
                    },
                    "additionalProperties": false
                  },
                  "textValue": {
                    "oneOf": [
                      {"type": "string", "minLength": 1},
                      {"$ref": "#/$defs/reference"}
                    ]
                  },
                  "reference": {
                    "type": "object",
                    "properties": {
                      "ref": {"$ref": "#/$defs/readPath"}
                    },
                    "required": ["ref"],
                    "additionalProperties": false,
                    "description": "Объект с единственным полем ref. После чтения пути движок проверяет тип полученного значения."
                  },
                  "readPath": {
                    "type": "string",
                    "pattern": "^(?:event\\.text|(?:input|state)\\.[A-Za-z][A-Za-z0-9_]*(?:\\.[A-Za-z][A-Za-z0-9_]*)*|.+\\.result(?:\\.[A-Za-z][A-Za-z0-9_]*)*)$",
                    "description": "Путь в input или state, event.text либо <id>.result с необязательным путём к полю результата текущего запуска."
                  },
                  "blockId": {
                    "type": "string",
                    "minLength": 1,
                    "description": "Непустой ID целевого блока в этом воркфлоу. Регистр учитывается."
                  }
                },
                "examples": [
                  {
                    "model": "tts-example",
                    "input": [
                      {"type": "text", "value": "Дорогие друзья!"},
                      {
                        "type": "text",
                        "value": {"ref": "VIDEO.greeting.result.text"}
                      }
                    ],
                    "next": "VIDEO.clip",
                    "onError": "VIDEO.generation_issue"
                  }
                ]
              }

          - type: generate_video
            description: >-
              Передаёт модели элементы text, img, audio и video по порядку. Один тип может повторяться. После сохранения файла <id>.result содержит assetId, kind со значением video и mimeType.
            schema: |-
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "properties": {
                  "model": {"type": "string", "minLength": 1, "description": "Идентификатор вызываемой модели."},
                  "token": {
                    "type": "string",
                    "minLength": 1,
                    "writeOnly": true,
                    "description": "Токен авторизации, если модель его требует."
                  },
                  "input": {
                    "type": "array",
                    "description": "Один или несколько входов. Можно смешивать типы и повторять их. Порядок сохраняется. Ограничения конкретной модели проверяются при выполнении.",
                    "minItems": 1,
                    "items": {
                      "oneOf": [
                        {"$ref": "#/$defs/textInput"},
                        {"$ref": "#/$defs/mediaInput"}
                      ]
                    }
                  },
                  "next": {"$ref": "#/$defs/blockId", "description": "ID следующего блока после успешного шага."},
                  "onError": {"$ref": "#/$defs/blockId", "description": "ID блока обработки ошибки шага."}
                },
                "required": ["model", "input"],
                "additionalProperties": false,
                "$defs": {
                  "textInput": {
                    "type": "object",
                    "required": ["type", "value"],
                    "properties": {
                      "type": {"const": "text"},
                      "value": {
                        "$ref": "#/$defs/textValue",
                        "description": "Непустая строка или объект {ref}, указывающий на строку."
                      }
                    },
                    "additionalProperties": false
                  },
                  "textValue": {
                    "oneOf": [
                      {"type": "string", "minLength": 1},
                      {"$ref": "#/$defs/reference"}
                    ]
                  },
                  "reference": {
                    "type": "object",
                    "properties": {
                      "ref": {"$ref": "#/$defs/readPath"}
                    },
                    "required": ["ref"],
                    "additionalProperties": false,
                    "description": "Объект с единственным полем ref. После чтения пути движок проверяет тип полученного значения."
                  },
                  "readPath": {
                    "type": "string",
                    "pattern": "^(?:event\\.text|(?:input|state)\\.[A-Za-z][A-Za-z0-9_]*(?:\\.[A-Za-z][A-Za-z0-9_]*)*|.+\\.result(?:\\.[A-Za-z][A-Za-z0-9_]*)*)$",
                    "description": "Путь в input или state, event.text либо <id>.result с необязательным путём к полю результата текущего запуска."
                  },
                  "mediaInput": {
                    "type": "object",
                    "required": ["type", "value"],
                    "properties": {
                      "type": {
                        "type": "string",
                        "enum": ["audio", "video", "img"],
                        "description": "audio — аудиофайл, video — видеофайл, img — изображение."
                      },
                      "value": {
                        "description": "Абсолютный HTTP(S) URL файла или объект {ref}, указывающий на медиа указанного типа. Для img ожидается изображение.",
                        "oneOf": [
                          {
                            "type": "string",
                            "format": "uri",
                            "pattern": "^[Hh][Tt][Tt][Pp][Ss]?://(?:[^\\s/?#@]+@)?(?:\\[[^\\]\\s/?#@]+\\]|[^\\s:/?#@\\[\\]]+)(?::[0-9]+)?(?:[/?#][^\\s]*)?$"
                          },
                          {"$ref": "#/$defs/reference"}
                        ]
                      }
                    },
                    "additionalProperties": false
                  },
                  "blockId": {
                    "type": "string",
                    "minLength": 1,
                    "description": "Непустой ID целевого блока в этом воркфлоу. Регистр учитывается."
                  }
                },
                "examples": [
                  {
                    "model": "video-example",
                    "input": [
                      {
                        "type": "img",
                        "value": {"ref": "input.firstFrame"}
                      },
                      {
                        "type": "img",
                        "value": {"ref": "input.lastFrame"}
                      },
                      {
                        "type": "audio",
                        "value": {"ref": "VIDEO.voice.result"}
                      },
                      {"type": "text", "value": "Сделай переход от первого кадра ко второму под озвучку."}
                    ],
                    "next": "VIDEO.deliver",
                    "onError": "VIDEO.generation_issue"
                  }
                ]
              }
