openapi: 3.1.0

info:
  title: Common Api
  description: Схемы, общие для сервисов System1. Путей не содержит.
  version: 1.0.0

components:
  parameters:
    TemporaryUserId:
      name: userId
      in: query
      required: false
      description: >-
        Временный UUID владельца для тестов до введения аутентификации. При отсутствии параметра
        используется тестовый владелец по умолчанию. Явное значение должно быть непустым ненулевым UUID.
      schema:
        type: string
        format: uuid
        default: 00000000-0000-0000-0000-000000000001

  schemas:

    ServiceInfoDto:
      type: object
      description: Какой сервис отвечает и в каком окружении он запущен.
      required:
        - service
        - env
      properties:
        service:
          type: string
          description: Имя сервиса.
          example: s1-dialogs
        env:
          type: string
          description: Окружение из переменной S1_ENV.
          example: stage
