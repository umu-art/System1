version: "2"

overrides:
  go:
    overrides:
      - db_type: uuid
        go_type:
          import: github.com/google/uuid
          type: UUID
      - db_type: uuid
        nullable: true
        go_type:
          import: github.com/google/uuid
          type: UUID
          pointer: true
      - db_type: pg_catalog.timestamptz
        go_type:
          import: time
          type: Time
      - db_type: pg_catalog.timestamptz
        nullable: true
        go_type:
          import: time
          type: Time
          pointer: true

sql:
  - engine: postgresql
    schema: ../../db/postgres/migrations
    queries: s1-dialogs/store/queries
    gen:
      go:
        package: sqlc
        out: s1-dialogs/store/sqlc
        sql_package: pgx/v5
        emit_pointers_for_null_types: true

  - engine: postgresql
    schema: ../../db/postgres/migrations
    queries: s1-channels-gateway/store/queries
    gen:
      go:
        package: sqlc
        out: s1-channels-gateway/store/sqlc
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
